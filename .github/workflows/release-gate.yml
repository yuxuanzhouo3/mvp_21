name: release-gate

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  mainline-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release gate tests
        run: npm run test:release-gate

      - name: Run region consistency matrix tests
        run: npm run test:region-consistency
